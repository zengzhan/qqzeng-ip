[package]
name = "qzdb_reader"
version = "1.0.5"
edition = "2021"

[dependencies]
arc-swap = "1"
memmap2 = "0.9"
serde_json = "1"

[dev-dependencies]
serde_json = "1"
rayon = "1"

[[bin]]
name = "bench_qps"
path = "bench_qps.rs"

[[bin]]
name = "batch_rust"
path = "src/bin/batch_rust.rs"

[[bin]]
name = "main"
path = "src/main.rs"

[[bin]]
name = "demo"
path = "src/bin/demo.rs"

[[bin]]
name = "dump_rust"
path = "src/bin/dump_rust.rs"

[[bin]]
name = "regress_rust"
path = "src/bin/regress_rust.rs"

[[bin]]
name = "metaprobe"
path = "src/bin/metaprobe.rs"
