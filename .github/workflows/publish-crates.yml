name: Publish Rust crate to crates.io

# 打 v-rust-* tag（或手动 workflow_dispatch）时，自动发布 Rust SDK 到 crates.io。
#
# 需要先在仓库 Settings → Secrets and variables → Actions 配置：
#   CARGO_REGISTRY_TOKEN —— https://crates.io/settings/tokens 生成的 API token
#                           （作用域 publish-update，只对 qzdb 这一个 crate 生效）
#
# 两个必须知道的前提（都不可逆）：
#   1. crates.io 的 crate 名一旦占用即永久归属，无法转让、无法删除。
#   2. 版本号一经发布即永久锁定，不能覆盖重发（只能 yank 后升版本）。
#
# 因此发布前务必本地先跑一次 dry run，确认包内容与编译都正常：
#   cd multi-lang/rust && cargo package --allow-dirty
#
# tag 约定：v-rust-* 只触发本 workflow；纯版本号开头的 v1.0.x 会触发全部平台发布。
on:
  push:
    tags:
      - 'v-rust-*'
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Verify package contents (dry run)
        working-directory: multi-lang/rust
        run: cargo package --locked --allow-dirty

      - name: Publish to crates.io
        working-directory: multi-lang/rust
        run: cargo publish --locked --allow-dirty
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
