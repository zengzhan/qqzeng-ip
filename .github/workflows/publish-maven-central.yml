name: Publish Java SDK to Maven Central

# 在打 tag（v*）时自动构建 + GPG 签名 + 发布到 Maven Central。
# central-publishing-maven-plugin 从 settings.xml 的 serverId=central 读取凭证，
# 由 actions/setup-java 的 server-username / server-password 自动生成该文件。
# 需要先在仓库 Settings → Secrets and variables → Actions 配置 4 个 secret：
#   CENTRAL_USERNAME  —— Sonatype User Token 的 username
#   CENTRAL_TOKEN     —— Sonatype User Token 的 password
#   GPG_PRIVATE_KEY   —— ASCII-armored 私钥（gpg --armor --export-secret-keys <id> 的输出）
#   GPG_PASSPHRASE    —— 该 GPG 私钥的口令（本仓库密钥无口令可留空）
on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          # 这两项会写入 ~/.m2/settings.xml，供 central-publishing-maven-plugin
          # 通过 publishingServerId=central 读取进行认证。
          server-id: central
          server-username: CENTRAL_USERNAME
          server-password: CENTRAL_TOKEN

      - name: Import GPG private key
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          printf '%s' "$GPG_PRIVATE_KEY" | gpg --batch --import

      - name: Publish to Maven Central
        working-directory: ip-qzdb-sdk/java
        env:
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_TOKEN: ${{ secrets.CENTRAL_TOKEN }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: mvn -B -Ppublish-central -Dgpg.passphrase="$GPG_PASSPHRASE" deploy
