name: Publish Python to PyPI

# 打 v-python-* 或 v* tag 时，自动构建 + 发布 Python SDK 到 PyPI。
# 需要先在仓库 Settings → Secrets and variables → Actions 配置：
#   PYPI_API_TOKEN —— PyPI 的 API token（https://pypi.org/manage/account/token/ 创建，
#                     作用域限定项目 qzdb；以 pypi- 开头）
# 发布产物：qzdb-<ver>.tar.gz (sdist) + qzdb-<ver>-py3-none-any.whl (wheel)
on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Build sdist and wheel
        working-directory: multi-lang/python
        run: python -m build

      - name: Verify package (twine check)
        working-directory: multi-lang/python
        run: twine check dist/*

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
          packages-dir: multi-lang/python/dist/
