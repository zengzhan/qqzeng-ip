name: SDK Publish Gate

# 本 workflow 跑在 GitHub **发布仓库**（聚合 4 条产品线，只含 SDK 源码与文档，
# 不含测试基建、tools/ 与商业数据库）。因此它只做「发布门禁」级检查：
#   1. 各语言源码的语法 / 编译可达性
#   2. PHP 包定义（composer.json）合法性
#   3. Rust crate 可打包性（cargo package，等价于 cargo publish 的前置校验）
#
# 需要跑测试套件与跨语言对拍的完整验证在**开发仓库**进行，那里才有 tests/ 与 tools/。
#
# ⚠️ 两个坑（都实际踩过）：
#   - 路径一律是 `ip-qzdb-sdk/`（发布仓库语境），不是开发仓库的 `multi-lang/`。
#     曾因沿用 multi-lang 导致本 workflow 每一步都 cd 进不存在的目录。
#   - 本文件不在 tools/sync_to_github.py 的同步清单内（.github/ 手工维护），
#     改动直接提交到发布仓库即可，不会被下次同步覆盖。

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish-gate:
    name: Publish gate (data-free)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: PHP — lint SDK source
        run: php -l ip-qzdb-sdk/php/QzdbReader.php

      - name: PHP — composer validate (strict)
        run: |
          composer validate --strict --no-check-publish
          composer validate --strict

      - name: Set up Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Rust — cargo check + package dry-run
        working-directory: ip-qzdb-sdk/rust
        run: |
          cargo check
          cargo package --allow-dirty

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # 发布仓库只同步 src/main/java（测试源按同步规范不上公开仓），
      # 故这里保持裸 javac 整树编译，不引入 Maven 依赖。
      - name: Java — compile source tree
        working-directory: ip-qzdb-sdk/java
        run: |
          mkdir -p build
          javac -encoding UTF-8 -d build $(find src -name '*.java')

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: C# — build SDK (single TFM)
        working-directory: ip-qzdb-sdk/netcore
        run: >
          dotnet build QQZeng.Qzdb.csproj -c Release -v:q
          -p:TargetFramework=net10.0 -p:TargetFrameworks=net10.0

      - name: Set up Go 1.22
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Go — build
        working-directory: ip-qzdb-sdk/go
        run: go build ./...

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Node.js — syntax check
        run: node --check ip-qzdb-sdk/nodejs/qzdb.js

      - name: Python — byte-compile
        working-directory: ip-qzdb-sdk/python
        run: python3 -m py_compile qzdb.py

      - name: C — syntax check
        working-directory: ip-qzdb-sdk/c
        run: cc -fsyntax-only -std=c11 qzdb_reader.c

  php-version-matrix:
    name: PHP ${{ matrix.php }} — lint + 零告警类加载
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # 与 composer.json 的 "php": ">=7.4" 一一对应。
        # 7.4 是最低支持版本，必须实测；8.5 是当前最新稳定版。
        php: ['7.4', '8.0', '8.1', '8.2', '8.3', '8.4', '8.5']
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: '${{ matrix.php }}'
          coverage: none
          ini-values: error_reporting=E_ALL, display_errors=On

      - name: PHP — lint
        run: php -l ip-qzdb-sdk/php/QzdbReader.php

      - name: PHP — 类加载与最小查询（E_ALL 下必须零告警）
        run: |
          set -o pipefail
          out=$(php -d error_reporting=E_ALL -d display_errors=On -r '
            require "ip-qzdb-sdk/php/QzdbReader.php";
            $r = new Qqzeng\Ip\QzdbReader();
            $b = Qqzeng\Ip\QzdbBuilder::bytes(str_repeat("\0", 256));
            echo "load-ok\n";
          ' 2>&1)
          echo "$out"
          # 弃用告警必须当失败处理：功能测试抓不到它，而它会在开发环境污染响应体。
          # 历史案例：GeoInfo::offsetGet() 缺 mixed 返回类型，PHP 8.1+ 每次类加载都发
          # E_DEPRECATED，但全部功能测试仍是绿的。
          if echo "$out" | grep -qiE 'deprecat|warning|notice|fatal'; then
            echo "::error::PHP ${{ matrix.php }} 下出现告警/弃用输出"
            exit 1
          fi
          echo "$out" | grep -q 'load-ok'

  php-compatibility:
    name: PHPCompatibility — 跨版本静态兼容性
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      # 用 phar + 源码 tarball 而非 composer：PHPCompatibility 10.x 只在
      # develop 分支上（GitHub 的 latest release 停在 2019 年的 9.3.5），
      # 且它要求 PHP_CodeSniffer 4.x（3.x 缺 Tokens::EMPTY_TOKENS）与 PHPCSUtils。
      - name: 安装 PHP_CodeSniffer 4.x + PHPCompatibility + PHPCSUtils
        run: |
          mkdir -p /tmp/pcstandards
          curl -sSL -o /tmp/phpcs.phar \
            https://github.com/PHPCSStandards/PHP_CodeSniffer/releases/download/4.0.4/phpcs.phar
          curl -sSL -o /tmp/pc.tar.gz \
            https://github.com/PHPCompatibility/PHPCompatibility/archive/refs/heads/develop.tar.gz
          curl -sSL -o /tmp/pcu.tar.gz \
            https://github.com/PHPCSStandards/PHPCSUtils/archive/refs/heads/develop.tar.gz
          mkdir -p /tmp/pc /tmp/pcu
          tar -xzf /tmp/pc.tar.gz  -C /tmp/pc  --strip-components=1
          tar -xzf /tmp/pcu.tar.gz -C /tmp/pcu --strip-components=1
          cp -R /tmp/pc/PHPCompatibility /tmp/pcstandards/
          cp -R /tmp/pcu/PHPCSUtils     /tmp/pcstandards/
          cp /tmp/pc/PHPCSAliases.php   /tmp/pcstandards/

      # 区间上限取 8.6：composer 的 ">=7.4" 不设上限，而 PHP 8.6 改变了
      # trim() 的默认字符集（新增 \f）——不显式写死字符集就会跨版本漂移。
      - name: PHPCompatibility (testVersion 7.4-8.6)
        run: |
          php /tmp/phpcs.phar \
            --runtime-set installed_paths /tmp/pcstandards \
            --standard=PHPCompatibility \
            --runtime-set testVersion 7.4-8.6 \
            --report=full --report-width=140 \
            ip-qzdb-sdk/php/QzdbReader.php
