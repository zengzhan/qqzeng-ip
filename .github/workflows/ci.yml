name: SDK Publish & Quality Gate

permissions:
  contents: read

# GitHub 公开仓库 CI 门禁：
#   1. 发布门禁：全语言 SDK 真实编译 / 语法可达性 / Cargo 与 Composer 打包校验
#   2. 质量门禁：全要素 Schema、跨语言逐字节对拍 (374 IP)、27 组黄金向量、C SDK ASan/UBSan 零泄漏
#   3. PHP 版本矩阵：7.4 ~ 8.5 跨版本严格兼容性校验

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gate:
    name: Gate (${{ matrix.os }}, Py-${{ matrix.python }}, Node-${{ matrix.node }}, Go-${{ matrix.go }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.10"
            node: "20"
            go: "1.21"
          - os: ubuntu-latest
            python: "3.13"
            node: "22"
            go: "stable"
          - os: ubuntu-latest
            python: "3.10"
            node: "22"
            go: "stable"
          - os: ubuntu-latest
            python: "3.13"
            node: "20"
            go: "1.21"
          - os: macos-latest
            python: "3.10"
            node: "20"
            go: "1.21"
          - os: macos-latest
            python: "3.13"
            node: "22"
            go: "stable"
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: ${{ matrix.python }}

      - name: Set up Node.js ${{ matrix.node }}
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: ${{ matrix.node }}

      - name: Set up Go ${{ matrix.go }}
        uses: actions/setup-go@f111f3307d8850f501ac008e886eec1fd1932a34 # v5.3.0
        with:
          go-version: ${{ matrix.go }}

      - name: Set up PHP 8.3
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2.40.0
        with:
          php-version: "8.3"
          coverage: none

      - name: Install C Toolchain (Ubuntu)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y gcc

      - name: Gate 1 — Markdown Relative Links (Zero Broken)
        run: python3 scripts/ci/check_markdown_links.py .

      - name: Gate 2 — Package Versions Single Source of Truth
        run: python3 scripts/ci/check_versions.py

      - name: Gate 3 — 25-Dimension Schema Parity
        run: python3 scripts/ci/verify_schema_parity.py

      - name: Gate 4 — 27 Golden Vectors Baseline
        run: python3 scripts/ci/test_golden_vectors.py

      - name: Gate 5 — C SDK ASan/UBSan & Memory Safety
        run: bash scripts/ci/test_c_sdk.sh

      - name: Gate 6a — Selftest (Verify Require Mechanism Anti-Fake-Green)
        run: bash scripts/ci/selftest_require.sh

      - name: Gate 6b — Multi-Language Demo Parity (All 374 IPs Strict)
        run: python3 scripts/ci/verify_demo_parity.py --langs c,node,go,php --require c,node,go,php

  publish-gate:
    name: SDK Build Gate (data-free)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: PHP — lint SDK source
        run: php -l ip-qzdb-sdk/php/QzdbReader.php

      - name: PHP — composer validate (strict)
        run: |
          composer validate --strict --no-check-publish
          composer validate --strict

      - name: Set up Rust (stable)
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable

      - name: Rust — cargo check + package dry-run
        working-directory: ip-qzdb-sdk/rust
        run: |
          cargo check
          cargo package --allow-dirty

      - name: Set up Java 21
        uses: actions/setup-java@3a4f6e1af504cf6a31855fa899c6aa5355ba6c12 # v4.7.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Java — compile source tree (release 17)
        working-directory: ip-qzdb-sdk/java
        run: |
          mkdir -p build
          javac --release 17 -encoding UTF-8 -d build $(find src -name '*.java')

      - name: Set up .NET 10
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: "10.0.x"

      - name: C# — build SDK (single TFM)
        working-directory: ip-qzdb-sdk/netcore
        run: >
          dotnet build QQZeng.Qzdb.csproj -c Release -v:q
          -p:TargetFramework=net10.0 -p:TargetFrameworks=net10.0

      - name: Set up Go 1.21 (Minimum Declared Baseline)
        uses: actions/setup-go@f111f3307d8850f501ac008e886eec1fd1932a34 # v5.3.0
        with:
          go-version: "1.21"

      - name: Go — build & vet
        working-directory: ip-qzdb-sdk/go
        run: |
          go build ./...
          go vet ./...

      - name: Set up Node.js 20
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: "20"

      - name: Node.js — syntax check
        run: node --check ip-qzdb-sdk/nodejs/qzdb.js

      - name: Python — byte-compile
        working-directory: ip-qzdb-sdk/python
        run: python3 -m py_compile qzdb.py

      - name: C — build & compile check
        working-directory: ip-qzdb-sdk/c
        run: cc -std=c11 -Wall -Wextra -Werror -c qzdb_reader.c

  php-version-matrix:
    name: PHP ${{ matrix.php }} — lint + 零告警类加载
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.0', '8.1', '8.2', '8.3', '8.4', '8.5']
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2.40.0
        with:
          php-version: '${{ matrix.php }}'
          coverage: none
          ini-values: error_reporting=E_ALL, display_errors=On

      - name: PHP — lint
        run: php -l ip-qzdb-sdk/php/QzdbReader.php

      - name: PHP — 类加载与最小查询（E_ALL 下必须零告警）
        run: |
          set -o pipefail
          out=$(php -d error_reporting=E_ALL -d display_errors=On -r '
            require "ip-qzdb-sdk/php/QzdbReader.php";
            $r = new Qqzeng\Ip\QzdbReader();
            $b = Qqzeng\Ip\QzdbBuilder::bytes(str_repeat("\0", 256));
            echo "load-ok\n";
          ' 2>&1)
          echo "$out"
          if echo "$out" | grep -qiE 'deprecat|warning|notice|fatal'; then
            echo "::error::PHP ${{ matrix.php }} 下出现告警/弃用输出"
            exit 1
          fi
          echo "$out" | grep -q 'load-ok'

  php-compatibility:
    name: PHPCompatibility — 跨版本静态兼容性
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up PHP 8.3
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2.40.0
        with:
          php-version: '8.3'
          coverage: none

      - name: 安装 PHP_CodeSniffer 4.x + PHPCompatibility + PHPCSUtils
        run: |
          mkdir -p /tmp/pcstandards
          curl -sSL -o /tmp/phpcs.phar \
            https://github.com/PHPCSStandards/PHP_CodeSniffer/releases/download/4.0.4/phpcs.phar
          curl -sSL -o /tmp/pc.tar.gz \
            https://github.com/PHPCompatibility/PHPCompatibility/archive/refs/heads/develop.tar.gz
          curl -sSL -o /tmp/pcu.tar.gz \
            https://github.com/PHPCSStandards/PHPCSUtils/archive/refs/heads/develop.tar.gz
          mkdir -p /tmp/pc /tmp/pcu
          tar -xzf /tmp/pc.tar.gz  -C /tmp/pc  --strip-components=1
          tar -xzf /tmp/pcu.tar.gz -C /tmp/pcu --strip-components=1
          cp -R /tmp/pc/PHPCompatibility /tmp/pcstandards/
          cp -R /tmp/pcu/PHPCSUtils     /tmp/pcstandards/
          cp /tmp/pc/PHPCSAliases.php   /tmp/pcstandards/

      - name: PHPCompatibility (testVersion 7.4-8.6)
        run: |
          php /tmp/phpcs.phar \
            --runtime-set installed_paths /tmp/pcstandards \
            --standard=PHPCompatibility \
            --runtime-set testVersion 7.4-8.6 \
            --report=full --report-width=140 \
            ip-qzdb-sdk/php/QzdbReader.php
