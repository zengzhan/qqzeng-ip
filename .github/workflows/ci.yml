name: SDK Publish Gate

# 本 workflow 跑在 GitHub **发布仓库**（聚合 4 条产品线，只含 SDK 源码与文档，
# 不含测试基建、tools/ 与商业数据库）。因此它只做「发布门禁」级检查：
#   1. 各语言源码的语法 / 编译可达性
#   2. PHP 包定义（composer.json）合法性
#   3. Rust crate 可打包性（cargo package，等价于 cargo publish 的前置校验）
#
# 需要跑测试套件与跨语言对拍的完整验证在**开发仓库**进行，那里才有 tests/ 与 tools/。
#
# ⚠️ 两个坑（都实际踩过）：
#   - 路径一律是 `ip-qzdb-sdk/`（发布仓库语境），不是开发仓库的 `multi-lang/`。
#     曾因沿用 multi-lang 导致本 workflow 每一步都 cd 进不存在的目录。
#   - 本文件不在 tools/sync_to_github.py 的同步清单内（.github/ 手工维护），
#     改动直接提交到发布仓库即可，不会被下次同步覆盖。

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish-gate:
    name: Publish gate (data-free)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: PHP — lint SDK source
        run: php -l ip-qzdb-sdk/php/QzdbReader.php

      - name: PHP — composer validate (strict)
        run: |
          composer validate --strict --no-check-publish
          composer validate --strict

      - name: Set up Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Rust — cargo check + package dry-run
        working-directory: ip-qzdb-sdk/rust
        run: |
          cargo check
          cargo package --allow-dirty

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Java — compile source tree
        working-directory: ip-qzdb-sdk/java
        run: |
          mkdir -p build
          javac -encoding UTF-8 -d build $(find src -name '*.java')

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: C# — build SDK (single TFM)
        working-directory: ip-qzdb-sdk/netcore
        run: >
          dotnet build QQZeng.Qzdb.csproj -c Release -v:q
          -p:TargetFramework=net10.0 -p:TargetFrameworks=net10.0

      - name: Set up Go 1.22
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Go — build
        working-directory: ip-qzdb-sdk/go
        run: go build ./...

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Node.js — syntax check
        run: node --check ip-qzdb-sdk/nodejs/qzdb.js

      - name: Python — byte-compile
        working-directory: ip-qzdb-sdk/python
        run: python3 -m py_compile qzdb.py

      - name: C — syntax check
        working-directory: ip-qzdb-sdk/c
        run: cc -fsyntax-only -std=c11 qzdb_reader.c
