version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  - package-ecosystem: "cargo"
    directory: "/ip-qzdb-sdk/rust"
    schedule:
      interval: "weekly"

  - package-ecosystem: "gomod"
    directory: "/ip-qzdb-sdk/go"
    schedule:
      interval: "weekly"

  - package-ecosystem: "npm"
    directory: "/ip-qzdb-sdk/nodejs"
    schedule:
      interval: "weekly"

  - package-ecosystem: "maven"
    directory: "/ip-qzdb-sdk/java"
    schedule:
      interval: "weekly"

  - package-ecosystem: "nuget"
    directory: "/ip-qzdb-sdk/netcore"
    schedule:
      interval: "weekly"

  - package-ecosystem: "pip"
    directory: "/ip-qzdb-sdk/python"
    schedule:
      interval: "weekly"
