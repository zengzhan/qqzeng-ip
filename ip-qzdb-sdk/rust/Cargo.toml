[package]
name = "qzdb"
version = "1.0.5"
edition = "2021"
rust-version = "1.74"
authors = ["qqzeng <qzdb@qqzeng.com>"]
description = "Offline, zero-runtime-dependency reader for .qzdb IP geolocation databases (IPv4 / IPv6 dual-stack)."
license = "MIT"
readme = "README.md"
repository = "https://github.com/zengzhan/qqzeng-ip"
homepage = "https://qqzeng.com"
documentation = "https://docs.rs/qzdb"
keywords = ["ip", "geolocation", "ip-lookup", "qzdb", "offline"]
categories = ["network-programming", "database", "parser-implementations"]

# crates.io 只发布 lib；以下均为仓库内部工具，不随包发布：
#   src/bin/*   — 跨语言对拍 / 元数据探针 / 回归工具。其中 metaprobe 依赖 dev-only 的
#                 serde_json，若随包发布，下游 `cargo install qzdb` 会因缺 dev-dependency
#                 直接编译失败（cargo publish 的 verify 不覆盖这条路径）。
#   src/main.rs — 手工冒烟 CLI，不是面向用户的产品二进制。
#   tests/*     — 依赖未随包发布的 .qzdb 数据文件，下游 `cargo test` 必然失败。
#   bench_qps.rs— 内部基准（未被任何 target 引用，仅作为普通文件打包）。
exclude = [
    "src/bin/*",
    "src/main.rs",
    "bench_qps.rs",
    "tests/*",
    "rustfmt.toml",
    ".DS_Store",
]

[dependencies]
arc-swap = "1"
memmap2 = "0.9"

[dev-dependencies]
rayon = "1"
serde_json = "1"
