[package]
name = "qzdb"
version = "2.0.2"
edition = "2024"
rust-version = "1.85"
authors = ["qqzeng <qzdb@qqzeng.com>"]
description = "Offline reader for .qzdb IP geolocation databases (IPv4 / IPv6 dual-stack). Runtime deps: arc-swap (lock-free snapshot swap), memmap2 (zero-copy file mapping)."
license = "MIT"
readme = "README.md"
repository = "https://github.com/zengzhan/qqzeng-ip"
homepage = "https://qqzeng.com"
documentation = "https://docs.rs/qzdb"
keywords = ["ip", "geolocation", "ip-lookup", "qzdb", "offline"]
categories = ["network-programming", "database", "parser-implementations"]

# crates.io 只发布 lib；除官方原生 MCP 工具 qzdb_mcp 外，内部回归探针不随包发布：
#   src/bin/batch_rust* / dump_rust / metaprobe / owned_vs_shared / regress_rust
#   src/main.rs — 手工冒烟 CLI，不是面向用户的产品二进制。
#   tests/*     — 依赖未随包发布的 .qzdb 数据文件，下游 `cargo test` 必然失败。
#   bench_qps.rs— 内部基准（开发仓内部基准，不随包发布、不在发布仓声明）。
exclude = [
    "src/bin/batch_rust*",
    "src/bin/demo.rs",
    "src/bin/dump_rust.rs",
    "src/bin/metaprobe.rs",
    "src/bin/owned_vs_shared.rs",
    "src/bin/regress_rust.rs",
    "src/main.rs",
    "tests/*",
    "crates/*",
    "rustfmt.toml",
    ".DS_Store",
]

[features]
default = []
wasm-lite = []

[dependencies]
arc-swap = "1"
crc32fast = "1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
memmap2 = "0.9"

[dev-dependencies]
rayon = "1"
serde_json = "1"

